# OpenSA (AGPL-3.0) - build de prueba Fase 1A. No contiene archivos de GTA San Andreas.
[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Mini-SA (prueba de recompilación Win32 -> WebAssembly): necesita aislamiento de origen
# (SharedArrayBuffer para los hilos). Solo se aplica a /mini-sa/, no afecta a OpenSA.
[[headers]]
  for = "/mini-sa/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"
